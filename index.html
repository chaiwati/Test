<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I’m Upper - โปสการ์ดอวยพรประจำวัน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Krub:wght@400;600;700&family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Prompt', sans-serif;
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    header {
      margin-bottom: 16px;
      text-align: center;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #38bdf8;
      text-transform: uppercase;
    }

    .postcard-wrapper {
      width: 100%;
      max-width: 360px;
      height: 640px;
      position: relative;
      border-radius: 0;
      overflow: hidden;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.6);
      background-color: #1e293b;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
    }

    .bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      transition: opacity 0.3s ease-in-out;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.85) 100%);
      z-index: 1;
    }

    .postcard-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-top {
      text-align: left;
    }

    .brand-tag {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #f3f4f6;
      opacity: 0.9;
      margin-bottom: 4px;
    }

    .day-greeting {
      font-size: 1.8rem;
      font-weight: 700;
      text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    }

    .card-bottom {
      text-align: center;
      margin-top: auto;
      width: 100%;
    }

    .wish-text {
      font-family: 'Krub', sans-serif;
      font-size: 1.1rem;
      line-height: 1.5;
      font-weight: 600;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(8px);
      padding: 16px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      white-space: pre-line;
      word-break: break-word;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      width: 100%;
      max-width: 360px;
    }

    .btn {
      flex: 1;
      padding: 12px 10px;
      border: none;
      border-radius: 12px;
      font-family: 'Prompt', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-generate {
      background-color: #0284c7;
      color: #ffffff;
    }

    .btn-generate:hover {
      background-color: #0369a1;
    }

    .btn-copy {
      background-color: #059669;
      color: #ffffff;
    }

    .btn-copy:hover {
      background-color: #047857;
    }

    .btn-download {
      background-color: #d97706;
      color: #ffffff;
    }

    .btn-download:hover {
      background-color: #b45309;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <h1>I’m Upper</h1>
  </header>

  <div class="postcard-wrapper" id="postcard">
    <img id="bgImg" class="bg-image" alt="Nature Destination">
    <div class="overlay"></div>
    <div class="postcard-content">
      <div class="card-top">
        <p class="brand-tag">I’m Upper</p>
        <h2 class="day-greeting" id="dayGreeting">สวัสดีวันอาทิตย์</h2>
      </div>

      <div class="card-bottom">
        <p class="wish-text" id="wishText">เติมพลังกายใจให้เต็มเปี่ยม
ขอให้มีความสุขตลอดวัน</p>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-generate" id="btnGen" onclick="generatePostcard()">
      🔄 สุ่มใหม่
    </button>
    <button class="btn btn-copy" id="btnCopy" onclick="copyPostcard()">
      📋 คัดลอก
    </button>
    <button class="btn btn-download" id="btnDown" onclick="downloadPostcard()">
      ⬇️ โหลดรูป
    </button>
  </div>

  <script>
    const wishComponentsByDay = {
      0: {
        s1: ["พักผ่อนสบายๆ ในวันอาทิตย์", "เติมพลังกายใจให้เต็มเปี่ยม", "เปิดรับความสุขและรอยยิ้ม", "ชาร์จแบตชีวิตในวันหยุด", "โอบกอดความสงบใจ"],
        s2: ["ขอให้มีความสุขตลอดวัน", "พบเจอแต่เรื่องราวงดงาม", "สุขใจในทุกช่วงเวลา", "รอยยิ้มแจ่มใสเบิกบาน", "เบาสบายไร้ความกังวล"]
      },
      1: {
        s1: ["เริ่มต้นวันจันทร์ด้วยพลังบวก", "เปิดรับโอกาสใหม่ๆ ในชีวิต", "ก้าวแรกของสัปดาห์ราบรื่น", "เริ่มต้นวันใหม่อย่างสดใส", "พร้อมลุยทุกเป้าหมาย"],
        s2: ["ทำสิ่งใดก็สำเร็จสมปรารถนา", "พบเจอแต่กัลยาณมิตรที่ดี", "ผ่านพ้นทุกงานได้อย่างง่ายดาย", "มีรอยยิ้มและเบิกบานใจ", "ก้าวหน้าและประสบความสำเร็จ"]
      },
      2: {
        s1: ["เติมพลังใจในวันอังคาร", "ขอให้มีสมาธิและไอเดียลื่นไหล", "ก้าวผ่านทุกงานยากสบายใจ", "ใจเบาสบายตลอดทั้งวัน", "สู้ทุกเป้าหมายอย่างมั่นใจ"],
        s2: ["ทุกภารกิจสำเร็จลุล่วงด้วยดี", "พบเจอแต่ความสุขรอบตัว", "เปลี่ยนความตั้งใจเป็นความสำเร็จ", "ได้รับมิตรภาพที่ดีเสมอ", "เปี่ยมด้วยพลังกายและใจ"]
      },
      3: {
        s1: ["สดใสกับวันพุธกลางสัปดาห์", "ขอให้การทำงานราบรื่นไร้อุปสรรค", "เติมความหวังและพลังบวก", "ใจเบาสบายและสดชื่น", "ส่งต่อพลังความสุขให้กัน"],
        s2: ["พบเจอแต่เรื่องราวชวนยิ้ม", "ผ่านพ้นทุกสิ่งได้อย่างราบรื่น", "ได้รับกำลังใจดีๆ เสมอ", "มีจิตใจที่เบิกบานแจ่มใส", "สำเร็จสมความตั้งใจ"]
      },
      4: {
        s1: ["สดชื่นสดใสในวันพฤหัสบดี", "ทำทุกอย่างด้วยใจเบาสบาย", "ราบรื่นและเรียบง่ายตลอดวัน", "เติมไฟความตั้งใจให้เต็มเปี่ยม", "พร้อมรับสิ่งดีๆ เข้ามา"],
        s2: ["ก้าวผ่านทุกอุปสรรคอย่างง่ายดาย", "เตรียมพร้อมรับวันหยุดสุดสัปดาห์", "พบเจอแต่ความสงบเรียบง่าย", "มีความสุขในทุกช่วงเวลา", "ยิ้มรับความสำเร็จในงาน"]
      },
      5: {
        s1: ["หรรษาต้อนรับวันศุกร์", "ทำงานสบายใจไร้ความกังวล", "เสร็จสิ้นภารกิจประจำสัปดาห์", "สดชื่นร่าเริงตลอดทั้งวัน", "ยิ้มรับความสุขในวันศุกร์"],
        s2: ["พร้อมต้อนรับวันหยุดแสนหวาน", "ผ่อนคลายความเหนื่อยล้าเต็มที่", "มีความสุขที่สุดในเย็นวันนี้", "เบิกบานใจในทุกช่วงเวลา", "เติมเต็มรอยยิ้มอย่างแท้จริง"]
      },
      6: {
        s1: ["สงบสุขและผ่อนคลายในวันเสาร์", "ใช้เวลากับคนที่รักอย่างคุ้มค่า", "ดื่มด่ำความสุขเรียบง่ายรอบตัว", "ชาร์จพลังชีวิตให้เต็มอิ่ม", "พักผ่อนกายใจแบบไม่เร่งรีบ"],
        s2: ["และได้ทำในสิ่งที่หัวใจรัก", "พร้อมโอบกอดความสุขรอบตัว", "ขอให้มีความสุขตลอดวันหยุด", "เพลิดเพลินกับเวลาพักผ่อน", "สุขใจอย่างแท้จริงตลอดวัน"]
      }
    };

    const dayNames = ["วันอาทิตย์", "วันจันทร์", "วันอังคาร", "วันพุธ", "วันพฤหัสบดี", "วันศุกร์", "วันเสาร์"];
    let generatedWishHistory = new Set();

    function getDynamicWish(dayIndex) {
      const comp = wishComponentsByDay[dayIndex];
      let wish = "";
      let attempts = 0;

      do {
        const s1 = comp.s1[Math.floor(Math.random() * comp.s1.length)];
        const s2 = comp.s2[Math.floor(Math.random() * comp.s2.length)];
        wish = `${s1}\n${s2}`;
        attempts++;
      } while (generatedWishHistory.has(wish) && attempts < 100);

      generatedWishHistory.add(wish);
      if (generatedWishHistory.size > 1000) generatedWishHistory.clear();
      return wish;
    }

    // สร้างภาพพื้นหลังแบบ Gradient วิวธรรมชาติรองรับเมื่อเกิดข้อผิดพลาด
    function generateGradientBackground() {
      const canvas = document.createElement('canvas');
      canvas.width = 720;
      canvas.height = 1280;
      const ctx = canvas.getContext('2d');
      
      const colorPairs = [
        ['#0f2027', '#203a43', '#2c5364'],
        ['#134e5e', '#71b280'],
        ['#2b5876', '#4e4376'],
        ['#1e3c72', '#2a5298'],
        ['#000428', '#004e92']
      ];
      
      const pair = colorPairs[Math.floor(Math.random() * colorPairs.length)];
      const grad = ctx.createLinearGradient(0, 0, 0, 1280);
      
      if(pair.length === 3) {
        grad.addColorStop(0, pair[0]);
        grad.addColorStop(0.5, pair[1]);
        grad.addColorStop(1, pair[2]);
      } else {
        grad.addColorStop(0, pair[0]);
        grad.addColorStop(1, pair[1]);
      }
      
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 720, 1280);
      return canvas.toDataURL('image/png');
    }

    function generatePostcard() {
      const btnGen = document.getElementById('btnGen');
      btnGen.disabled = true;
      btnGen.innerText = "⏳ โหลดรูปภาพ...";

      const dayIndex = new Date().getDay();
      document.getElementById('dayGreeting').innerText = `สวัสดี${dayNames[dayIndex]}`;
      document.getElementById('wishText').innerText = getDynamicWish(dayIndex);

      const imgElement = document.getElementById('bgImg');
      
      // สุ่ม ID ภาพธรรมชาติเพื่อป้องกันภาพดับและเปลี่ยนรูปได้เรื่อยๆ
      const randomImageId = Math.floor(Math.random() * 1000) + 1;
      const imageUrl = `https://picsum.photos/id/${randomImageId}/720/1280`;

      imgElement.onload = () => {
        btnGen.disabled = false;
        btnGen.innerText = "🔄 สุ่มใหม่";
      };

      imgElement.onerror = () => {
        // ถ้าดึง ID นั้นไม่เจอ ให้สลับใช้ภาพแบบ Random ทันที
        imgElement.onerror = () => {
          imgElement.src = generateGradientBackground();
          btnGen.disabled = false;
          btnGen.innerText = "🔄 สุ่มใหม่";
        };
        imgElement.src = `https://picsum.photos/720/1280?random=${Math.random()}`;
      };

      imgElement.src = imageUrl;
    }

    async function copyPostcard() {
      const cardElement = document.getElementById('postcard');
      const btnCopy = document.getElementById('btnCopy');
      btnCopy.disabled = true;
      btnCopy.innerText = "⏳ กำลังคัดลอก...";

      try {
        const canvas = await html2canvas(cardElement, { 
          scale: 2, 
          logging: false,
          useCORS: true,
          allowTaint: true
        });

        canvas.toBlob(async (blob) => {
          if (!blob) throw new Error("Canvas Blob failed");
          try {
            const item = new ClipboardItem({ 'image/png': blob });
            await navigator.clipboard.write([item]);
            btnCopy.innerText = "✅ คัดลอกแล้ว!";
          } catch (err) {
            alert('เบราว์เซอร์นี้จำกัดสิทธิ์คัดลอกอัตโนมัติ กรุณากดปุ่ม "⬇️ โหลดรูป" แทนครับ');
            btnCopy.innerText = "📋 คัดลอก";
          }
          setTimeout(() => {
            btnCopy.innerText = "📋 คัดลอก";
            btnCopy.disabled = false;
          }, 2000);
        }, 'image/png');

      } catch (err) {
        alert('เกิดข้อผิดพลาดในการคัดลอกรูปภาพ');
        btnCopy.innerText = "📋 คัดลอก";
        btnCopy.disabled = false;
      }
    }

    async function downloadPostcard() {
      const cardElement = document.getElementById('postcard');
      const btnDown = document.getElementById('btnDown');
      btnDown.disabled = true;
      btnDown.innerText = "⏳ กำลังสร้างไฟล์...";

      try {
        const canvas = await html2canvas(cardElement, { 
          scale: 2, 
          logging: false,
          useCORS: true,
          allowTaint: true
        });

        const link = document.createElement('a');
        link.download = `postcard-${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        
        btnDown.innerText = "✅ สำเร็จ!";
        setTimeout(() => {
          btnDown.innerText = "⬇️ โหลดรูป";
          btnDown.disabled = false;
        }, 2000);
      } catch (err) {
        alert('ดาวน์โหลดไม่สำเร็จ');
        btnDown.innerText = "⬇️ โหลดรูป";
        btnDown.disabled = false;
      }
    }

    window.onload = generatePostcard;
  </script>
</body>
</html>
