    header {

    }

      font-weight: 700;
      letter-spacing: 1.5px;
      color: #38bdf8;
      text-transform: uppercase;
    }

    .postcard-wrapper {
      width: 100%;
      max-width: 360px;
      height: 640px;
      position: relative;
      border-radius: 0;
      overflow: hidden;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.6);
      background-color: #1e293b;

      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
    }

    .bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      transition: opacity 0.4s ease-in-out;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.85) 100%);
      z-index: 1;
    }

    .postcard-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-top {
      text-align: left;
    }

    .brand-tag {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #f3f4f6;
      opacity: 0.9;
      margin-bottom: 4px;
    }

    .day-greeting {
      font-size: 1.8rem;
      font-weight: 700;
      text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    }

    .card-bottom {
      text-align: center;
      margin-top: auto;
      width: 100%;
    }

    .wish-text {
      font-family: 'Krub', sans-serif;
      font-size: 1.1rem;
      line-height: 1.5;
      font-weight: 600;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(8px);
      padding: 16px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      white-space: pre-line;
      word-break: break-word;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      width: 100%;
      max-width: 360px;
    }

    .btn {
      flex: 1;
      padding: 12px 10px;
      border: none;
      border-radius: 12px;
      font-family: 'Prompt', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-generate {
      background-color: #0284c7;
      color: #ffffff;
    }

    .btn-generate:hover {
      background-color: #0369a1;
    }

    .btn-copy {
      background-color: #059669;
      color: #ffffff;
    }

    .btn-copy:hover {
      background-color: #047857;
    }

    .btn-download {
      background-color: #d97706;
      color: #ffffff;
    }

    .btn-download:hover {
      background-color: #b45309;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;

    // แปลง ID เป็น Full Direct URL แนวตั้ง 720x1280
    const natureImagePool = natureImageIds.map(id => `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=720&h=1280&q=80`);

    const dayNames = ["วันอาทิตย์", "วันจันทร์", "วันอังคาร", "วันพุธ", "วันพฤหัสบดี", "วันศุกร์", "วันเสาร์"];
    let generatedWishHistory = new Set();
    let shuffledImagePool = [];
    let currentImageIndex = 0;

    // ระบบ Shuffle แบบ Fisher-Yates จัดคิวสุ่มรูปทั้ง 100 ภาพไม่ให้ซ้ำกันเลย
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getNextImageUrl() {
      if (shuffledImagePool.length === 0 || currentImageIndex >= shuffledImagePool.length) {
        shuffledImagePool = shuffleArray(natureImagePool);
        currentImageIndex = 0;
      }
      const selectedUrl = shuffledImagePool[currentImageIndex];
      currentImageIndex++;
      return selectedUrl;
    }

    function getDynamicWish(dayIndex) {
      const comp = wishComponentsByDay[dayIndex];
      let wish = "";
      let attempts = 0;

      do {
        const s1 = comp.s1[Math.floor(Math.random() * comp.s1.length)];
        const s2 = comp.s2[Math.floor(Math.random() * comp.s2.length)];
        wish = `${s1}\n${s2}`;
        attempts++;
      } while (generatedWishHistory.has(wish) && attempts < 100);

      generatedWishHistory.add(wish);
      if (generatedWishHistory.size > 1000) generatedWishHistory.clear();
      return wish;
    }

    function generatePostcard() {
      const dayIndex = new Date().getDay();
      document.getElementById('dayGreeting').innerText = `สวัสดี${dayNames[dayIndex]}`;
      document.getElementById('wishText').innerText = getDynamicWish(dayIndex);

      const imgElement = document.getElementById('bgImg');
      imgElement.src = getNextImageUrl();
    }

    async function copyPostcard() {

      const btnCopy = document.getElementById('btnCopy');

      btnCopy.innerText = "⏳ กำลังคัดลอก...";

      try {
        const canvas = await html2canvas(cardElement, { 
          scale: 2, 
          logging: false,
          useCORS: true,
          allowTaint: true
        });

        canvas.toBlob(async (blob) => {
          if (!blob) throw new Error("Canvas Blob failed");
          try {
            const item = new ClipboardItem({ 'image/png': blob });
            await navigator.clipboard.write([item]);
            btnCopy.innerText = "✅ คัดลอกแล้ว!";
          } catch (err) {
            alert('เบราว์เซอร์นี้จำกัดสิทธิ์คัดลอกอัตโนมัติ กรุณากดปุ่ม "⬇️ โหลดรูป" แทนครับ');
            btnCopy.innerText = "📋 คัดลอก";
          }
          setTimeout(() => {
            btnCopy.innerText = "📋 คัดลอก";
            btnCopy.disabled = false;
          }, 2000);
        }, 'image/png');

      } catch (err) {
        alert('เกิดข้อผิดพลาดในการคัดลอกรูปภาพ');
        btnCopy.innerText = "📋 คัดลอก";
        btnCopy.disabled = false;
      }
    }

    async function downloadPostcard() {
      const cardElement = document.getElementById('postcard');
      const btnDown = document.getElementById('btnDown');
      btnDown.disabled = true;
      btnDown.innerText = "⏳ กำลังสร้างไฟล์...";

      try {
        const canvas = await html2canvas(cardElement, { 
          scale: 2, 
          logging: false,
          useCORS: true,
          allowTaint: true
        });

        const link = document.createElement('a');
        link.download = `postcard-${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        
        btnDown.innerText = "✅ สำเร็จ!";
        setTimeout(() => {
          btnDown.innerText = "⬇️ โหลดรูป";
          btnDown.disabled = false;
        }, 2000);
      } catch (err) {
        alert('ดาวน์โหลดไม่สำเร็จ');
        btnDown.innerText = "⬇️ โหลดรูป";
        btnDown.disabled = false;
      }
    }

    window.onload = generatePostcard;
  </script>
</body>
</html>
