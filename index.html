<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I’m Upper - โปสการ์ดอวยพรประจำวัน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Krub:wght@400;600;700&family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Prompt', sans-serif;
      background-color: #0b0f19;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    header {
      margin-bottom: 16px;
      text-align: center;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #38bdf8;
      text-transform: uppercase;
    }

    .postcard-wrapper {
      width: 100%;
      max-width: 360px;
      height: 640px;
      position: relative;
      border-radius: 0;
      overflow: hidden;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.6);
      background-color: #1e293b;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
    }

    .bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      transition: opacity 0.4s ease-in-out;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.85) 100%);
      z-index: 1;
    }

    .postcard-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-top {
      text-align: left;
    }

    .brand-tag {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #f3f4f6;
      opacity: 0.9;
      margin-bottom: 4px;
    }

    .day-greeting {
      font-size: 1.8rem;
      font-weight: 700;
      text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    }

    .card-bottom {
      text-align: center;
      margin-top: auto;
      width: 100%;
    }

    .wish-text {
      font-family: 'Krub', sans-serif;
      font-size: 1.1rem;
      line-height: 1.5;
      font-weight: 600;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(8px);
      padding: 16px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      white-space: pre-line;
      word-break: break-word;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      width: 100%;
      max-width: 360px;
    }

    .btn {
      flex: 1;
      padding: 12px 10px;
      border: none;
      border-radius: 12px;
      font-family: 'Prompt', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-generate {
      background-color: #0284c7;
      color: #ffffff;
    }

    .btn-generate:hover {
      background-color: #0369a1;
    }

    .btn-copy {
      background-color: #059669;
      color: #ffffff;
    }

    .btn-copy:hover {
      background-color: #047857;
    }

    .btn-download {
      background-color: #d97706;
      color: #ffffff;
    }

    .btn-download:hover {
      background-color: #b45309;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <header>
    <h1>I’m Upper</h1>
  </header>

  <div class="postcard-wrapper" id="postcard">
    <img id="bgImg" class="bg-image" alt="Nature Destination" crossorigin="anonymous">
    <div class="overlay"></div>
    <div class="postcard-content">
      <div class="card-top">
        <p class="brand-tag">I’m Upper</p>
        <h2 class="day-greeting" id="dayGreeting">สวัสดีวันอาทิตย์</h2>
      </div>

      <div class="card-bottom">
        <p class="wish-text" id="wishText">ปล่อยวางเรื่องวุ่นวายในใจ
เติมรอยยิ้มรับวันหยุดสุดสดใส</p>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-generate" id="btnGen" onclick="generatePostcard()">
      🔄 สุ่มใหม่
    </button>
    <button class="btn btn-copy" id="btnCopy" onclick="copyPostcard()">
      📋 คัดลอก
    </button>
    <button class="btn btn-download" id="btnDown" onclick="downloadPostcard()">
      ⬇️ โหลดรูป
    </button>
  </div>

  <script>
    // ชุดคำอวยพรเซ็ตใหม่ทั้งหมด
    const wishComponentsByDay = {
      0: { // วันอาทิตย์
        s1: ["ปล่อยวางเรื่องวุ่นวายในใจ", "ให้ธรรมชาติช่วยฮีลใจในวันหยุด", "ตื่นรับแสงแดดยามเช้าอันอบอุ่น", "พักกายพักใจให้หายเหนื่อย", "ดื่มด่ำความสงบในวันสบายๆ"],
        s2: ["เติมรอยยิ้มรับวันหยุดสุดสดใส", "ขอให้เป็นวันหยุดที่แสนพิเศษ", "พบเจอแต่เรื่องราวอบอุ่นหัวใจ", "เก็บเกี่ยวพลังบวกให้เต็มเปี่ยม", "มีความสุขกับสิ่งเล็กๆ รอบตัว"]
      },
      1: { // วันจันทร์
        s1: ["เปิดใจรับสัปดาห์ใหม่อย่างสดใส", "พกความมั่นใจมาเต็มร้อย", "ก้าวสู่เป้าหมายด้วยพลังเต็มเปี่ยม", "อรุณสวัสดิ์เช้าวันจันทร์แสนเบิกบาน", "ทุกการเริ่มต้นใหม่ย่อมมีสิ่งดีๆ"],
        s2: ["ขอให้การงานราบรื่นไร้อุปสรรค", "พบเจอแต่รอยยิ้มและกัลยาณมิตร", "ก้าวหน้าและสำเร็จในทุกสิ่งที่ทำ", "มีแรงบันดาลใจใหม่ๆ ตลอดวัน", "เงินทองไหลมาเทมาไม่ขาดสาย"]
      },
      2: { // วันอังคาร
        s1: ["มุ่งมั่นเดินหน้าต่ออย่างมั่นใจ", "ก้าวผ่านทุก challenge ด้วยรอยยิ้ม", "เติมพลังความสดใสในวันอังคาร", "สู้สุดใจด้วยพลังใจที่เข้มแข็ง", "มองโลกในแง่ดีและมีสติเสมอ"],
        s2: ["ราบรื่นสมปรารถนาในทุกภารกิจ", "ขอให้โชคดีและได้รับข่าวดีเสมอ", "พบเจอแต่คนดีๆ และสิ่งดีๆ", "ความพยายามนำพาความสำเร็จมาให้", "สุขภาพแข็งแรง สดชื่นตลอดวัน"]
      },
      3: { // วันพุธ
        s1: ["ครึ่งทางของสัปดาห์ยังสดใส", "ผ่อนคลายความเครียด เติมความสุข", "รักษารอยยิ้มและจิตใจที่เบาและสบาย", "เดินหน้าต่อด้วยพลังบวกเปี่ยมล้น", "สวัสดีวันพุธด้วยความเปรมปรีดิ์"],
        s2: ["ขอให้ชีวิตราบรื่นและมีชีวา", "เจรจาติดต่อสิ่งใดก็สำเร็จลุล่วง", "ได้รับความรักและความเมตตาเสมอ", "มีความสุขกับทุกงานที่ได้ทำ", "สมหวังในทุกสิ่งที่คาดหวังไว้"]
      },
      4: { // วันพฤหัสบดี
        s1: ["เติมความสดชื่นต้อนรับวันใหม่", "สั่งสมความสำเร็จทีละเล็กละน้อย", "ก้าวอย่างมั่นคงและภาคภูมิใจ", "ใจสงบ เบาสบาย สดใสไร้กังวล", "ส่งต่อกำลังใจดีๆ ให้แก่กัน"],
        s2: ["ใกล้ถึงวันหยุดพร้อมรอยยิ้ม", "ขอให้โชคลาภและความสุขหลั่งไหลมา", "ก้าวผ่านทุกอุปสรรคได้อย่างง่ายดาย", "ชีวิตเปี่ยมไปด้วยความสงบร่มเย็น", "พบเจอแต่เรื่องชวนยิ้มและอิ่มเอมใจ"]
      },
      5: { // วันศุกร์
        s1: ["ยิ้มรับวันศุกร์ด้วยความร่าเริง", "เคลียร์งานราบรื่น หัวใจเบาสบาย", "พร้อมต้อนรับความสุขปลายสัปดาห์", "ส่งท้ายสัปดาห์ด้วยพลังเต็มร้อย", "ความเหนื่อยล้ากำลังจะหายไป"],
        s2: ["เตรียมพร้อมพักผ่อนอย่างเต็มที่", "ขอให้เป็นเย็นวันศุกร์ที่แสนหรรษา", "สมปรารถนาในสิ่งที่ตั้งใจไว้", "มีความสุขและผ่อนคลายอย่างไร้กังวล", "พบเจอแต่รอยยิ้มและมิตรภาพที่ดี"]
      },
      6: { // วันเสาร์
        s1: ["ใช้วันหยุดให้คุ้มค่าและมีความสุข", "ให้เวลากับตัวเองและคนที่รัก", "พักสายตาและผ่อนคลายสมอง", "ตื่นมาพร้อมความสดชื่นแจ่มใส", "ใช้ชีวิตในจังหวะที่ช้าลงอย่างสุขใจ"],
        s2: ["ขอให้เป็นวันเสาร์ที่เต็มไปด้วยรอยยิ้ม", "เติมเต็มพลังกายและใจอย่างสมบูรณ์", "เพลิดเพลินกับทุกกิจกรรมที่ชอบ", "ความสุขและมิตรภาพโอบล้อมรอบตัว", "สุขกาย สุขใจ ไร้โรคภัยกล้ำกลาย"]
      }
    };

    const natureImagePool = [
      "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=720&q=80",
      "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=720&q=80",
      "https://images.unsplash.com/photo-1426604966848-d7adac402bff?auto=format&fit=crop&w=720&q=80",
      "https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=720&q=80",
      "https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?auto=format&fit=crop&w=720&q=80",
      "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=720&q=80",
      "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=720&q=80",
      "https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=720&q=80",
      "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=720&q=80",
      "https://images.unsplash.com/photo-1511497584788-876761c119ef?auto=format&fit=crop&w=720&q=80",
      "https://images.unsplash.com/photo-1439853949127-fa647821eba0?auto=format&fit=crop&w=720&q=80",
      "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=720&q=80"
    ];

    const dayNames = ["วันอาทิตย์", "วันจันทร์", "วันอังคาร", "วันพุธ", "วันพฤหัสบดี", "วันศุกร์", "วันเสาร์"];
    let generatedWishHistory = new Set();
    let lastImageIndex = -1;

    function getDynamicWish(dayIndex) {
      const comp = wishComponentsByDay[dayIndex];
      let wish = "";
      let attempts = 0;

      do {
        const s1 = comp.s1[Math.floor(Math.random() * comp.s1.length)];
        const s2 = comp.s2[Math.floor(Math.random() * comp.s2.length)];
        wish = `${s1}\n${s2}`;
        attempts++;
      } while (generatedWishHistory.has(wish) && attempts < 100);

      generatedWishHistory.add(wish);
      if (generatedWishHistory.size > 1000) generatedWishHistory.clear();
      return wish;
    }

    function getRandomImageUrl() {
      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * natureImagePool.length);
      } while (randomIndex === lastImageIndex);
      
      lastImageIndex = randomIndex;
      return natureImagePool[randomIndex];
    }

    function generatePostcard() {
      const dayIndex = new Date().getDay();
      document.getElementById('dayGreeting').innerText = `สวัสดี${dayNames[dayIndex]}`;
      document.getElementById('wishText').innerText = getDynamicWish(dayIndex);

      const imgElement = document.getElementById('bgImg');
      const newImgUrl = getRandomImageUrl();
      
      const tempImage = new Image();
      tempImage.crossOrigin = "anonymous";
      tempImage.onload = () => {
        imgElement.src = newImgUrl;
      };
      tempImage.src = newImgUrl;
    }

    async function copyPostcard() {
      const cardElement = document.getElementById('postcard');
      const btnCopy = document.getElementById('btnCopy');
      btnCopy.disabled = true;
      btnCopy.innerText = "⏳ กำลังคัดลอก...";

      try {
        const canvas = await html2canvas(cardElement, { 
          scale: 2, 
          logging: false,
          useCORS: true,
          allowTaint: false
        });

        canvas.toBlob(async (blob) => {
          if (!blob) throw new Error("Canvas Blob failed");
          try {
            const item = new ClipboardItem({ 'image/png': blob });
            await navigator.clipboard.write([item]);
            btnCopy.innerText = "✅ คัดลอกแล้ว!";
          } catch (err) {
            alert('เบราว์เซอร์นี้จำกัดสิทธิ์คัดลอกอัตโนมัติ กรุณากดปุ่ม "⬇️ โหลดรูป" แทนครับ');
            btnCopy.innerText = "📋 คัดลอก";
          }
          setTimeout(() => {
            btnCopy.innerText = "📋 คัดลอก";
            btnCopy.disabled = false;
          }, 2000);
        }, 'image/png');

      } catch (err) {
        alert('เกิดข้อผิดพลาดในการคัดลอกรูปภาพ');
        btnCopy.innerText = "📋 คัดลอก";
        btnCopy.disabled = false;
      }
    }

    async function downloadPostcard() {
      const cardElement = document.getElementById('postcard');
      const btnDown = document.getElementById('btnDown');
      btnDown.disabled = true;
      btnDown.innerText = "⏳ กำลังสร้างไฟล์...";

      try {
        const canvas = await html2canvas(cardElement, { 
          scale: 2, 
          logging: false,
          useCORS: true,
          allowTaint: false
        });

        const link = document.createElement('a');
        link.download = `postcard-${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        
        btnDown.innerText = "✅ สำเร็จ!";
        setTimeout(() => {
          btnDown.innerText = "⬇️ โหลดรูป";
          btnDown.disabled = false;
        }, 2000);
      } catch (err) {
        alert('ดาวน์โหลดไม่สำเร็จ');
        btnDown.innerText = "⬇️ โหลดรูป";
        btnDown.disabled = false;
      }
    }

    window.onload = generatePostcard;
  </script>
</body>
</html>
